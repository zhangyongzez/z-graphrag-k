# 完整栈：Milvus 独立服务 + Neo4j + 应用
#
# 常用命令：
#   docker compose up -d                          # 只起应用（Milvus Lite）
#   docker compose --profile milvus up -d         # 应用 + Milvus 服务端
#   docker compose --profile graph up -d          # 应用 + Neo4j
#   docker compose --profile milvus --profile graph up -d   # 全家桶

services:
  # ---------------------------------------------------------------- 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 需要本地 embedding（torch）时改成 1，镜像会大很多
        INSTALL_LOCAL: "0"
    image: kgrag:latest
    container_name: kgrag-app
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      # .env 不入库，首次部署时从 .env.example 复制
      - path: .env
        required: false
    environment:
      # 容器内路径与连接地址（覆盖 .env 里的宿主机值）
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 用了 milvus profile 时自动指向容器网络里的 milvus
      VECTORSTORE_PROVIDER: ${VECTORSTORE_PROVIDER:-lite}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
    volumes:
      - app_data:/app/data
      # 本地模型目录（可选）
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

  # ---------------------------------------------------------------- Milvus
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    # Docker Hub 已下架 minio/minio，使用社区维护的同名镜像
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    profiles: ["milvus"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # 该镜像 entrypoint 已是 minio，command 只写子命令
    command: server /minio_data --console-address ":9001"
    # 新版本 minio 以非 root 运行，而命名卷默认属主是 root，
    # 直接以 root 运行避免 "file access denied"
    user: "0:0"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      # 该镜像不含 mc 客户端，也没有 curl，改用 wget 做健康检查
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------------- Neo4j
  # 注意：宿主机 7687 已被占用，这里映射到 7688
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph"]
    environment:
      NEO4J_AUTH: neo4j/please_change_me
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    ports:
      - "7688:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  app_data:
  etcd_data:
  minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
